    <!-- Set the theme before first paint, so returning visitors with a saved
         preference never see a flash of the other theme. Defaults to light. -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var theme = stored === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
